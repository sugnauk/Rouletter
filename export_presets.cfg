html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">
<style>
@font-face { font-family: \"Silkscreen\"; src: url(\"Silkscreen-Regular.ttf\"); }
html, body, #status { background-color: #07050a !important; }
html, body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#canvas { position: fixed; top: 0; left: 0; }
#status-splash { image-rendering: pixelated; image-rendering: crisp-edges; }
#status-progress { -webkit-appearance: none; appearance: none; width: 240px; height: 10px; border: 2px solid #8a6420; background: #140d0f; image-rendering: pixelated; }
#status-progress::-webkit-progress-bar { background: #140d0f; }
#status-progress::-webkit-progress-value { background: #f2c14e; }
#status-progress::-moz-progress-bar { background: #f2c14e; }
#status-notice { font-family: \"Silkscreen\", monospace; color: #ff5d5d; background: #140d0f; border: 2px solid #8a6420; }
#loading-line { font-family: \"Silkscreen\", monospace; color: #7f9688; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; margin-top: 14px; text-align: center; }
</style>
<script>
window.addEventListener(\"DOMContentLoaded\", function () {
  var status = document.getElementById(\"status\");
  if (!status) return;
  var line = document.createElement(\"div\");
  line.id = \"loading-line\";
  status.appendChild(line);
  var lines = [\"Polishing the wheel\", \"Brushing the felt\", \"Counting the chips\", \"Mr. Vance will see you now\"];
  var i = 0;
  line.textContent = lines[0] + \"...\";
  var timer = setInterval(function () {
    if (status.style.display === \"none\" || !document.body.contains(status)) { clearInterval(timer); return; }
    i = (i + 1) % lines.length;
    line.textContent = lines[i] + \"...\";
  }, 1400);
});
/* Phones (iPhone Safari above all): keep the page pinned to the visible screen. Safari's bars and
   bounce-scrolling can leave the page scrolled, pushing the game under the address bar. Snap back
   to the top and nudge the engine to re-measure once the toolbars settle. The game also reads
   window.visualViewport itself and fits into the part that's really visible. */
(function () {
  function snap() { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }
  function settle() {
    snap();
    [0, 150, 400, 900].forEach(function (t) {
      setTimeout(function () { snap(); window.dispatchEvent(new Event(\"resize\")); }, t);
    });
  }
  window.addEventListener(\"orientationchange\", settle);
  window.addEventListener(\"pageshow\", settle);
  window.addEventListener(\"scroll\", snap, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener(\"resize\", settle);
    window.visualViewport.addEventListener(\"scroll\", snap);
  }
  document.addEventListener(\"touchmove\", function (e) { e.preventDefault(); }, { passive: false });
})();
</script>"
