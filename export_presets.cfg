html/head_include="<style>
@font-face { font-family: \"Silkscreen\"; src: url(\"Silkscreen-Regular.ttf\"); }
html, body, #status { background-color: #07050a !important; }
#status-splash { image-rendering: pixelated; image-rendering: crisp-edges; }
#status-progress { -webkit-appearance: none; appearance: none; width: 240px; height: 10px; border: 2px solid #8a6420; background: #140d0f; image-rendering: pixelated; }
#status-progress::-webkit-progress-bar { background: #140d0f; }
#status-progress::-webkit-progress-value { background: #f2c14e; }
#status-progress::-moz-progress-bar { background: #f2c14e; }
#status-notice { font-family: \"Silkscreen\", monospace; color: #ff5d5d; background: #140d0f; border: 2px solid #8a6420; }
#loading-line { font-family: \"Silkscreen\", monospace; color: #7f9688; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; margin-top: 14px; text-align: center; }
</style>
<script>
window.addEventListener(\"DOMContentLoaded\", function () {
  var status = document.getElementById(\"status\");
  if (!status) return;
  var line = document.createElement(\"div\");
  line.id = \"loading-line\";
  status.appendChild(line);
  var lines = [\"Polishing the wheel\", \"Brushing the felt\", \"Counting the chips\", \"Mr. Vance will see you now\"];
  var i = 0;
  line.textContent = lines[0] + \"...\";
  var timer = setInterval(function () {
    if (status.style.display === \"none\" || !document.body.contains(status)) { clearInterval(timer); return; }
    i = (i + 1) % lines.length;
    line.textContent = lines[i] + \"...\";
  }, 1400);
});
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
