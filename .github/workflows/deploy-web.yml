# Builds the Godot web version and publishes it to GitHub Pages on every push to main.
# Uses the official Godot release binaries and export templates from godotengine/godot-builds.
name: Build & deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$tdir/"
          rm -rf templates *.zip *.tpz

      - name: Stamp build version
        run: |
          stamp="$(git rev-parse --short HEAD) $(date -u +'%Y-%m-%d %H:%M')Z"
          sed -i "s|^const BUILD := .*|const BUILD := \"$stamp\"|" core/version.gd
          grep BUILD core/version.gd

      - name: Import project
        run: ./godot --headless --path . --import

      - name: Run tests
        run: ./godot --headless --path . --script res://tests/run_tests.gd

      - name: Export web build
        run: |
          mkdir -p build/web
          ./godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
